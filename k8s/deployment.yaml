apiVersion: apps/v1
kind: Deployment
metadata:
  name: devops-app
  namespace: devops
spec:
  replicas: 2
  selector:
    matchLabels:
      app: devops-app
  template:
    metadata:
      labels:
        app: devops-app
    spec:
      containers:
      - name: devops-app
        image: 485429562577.dkr.ecr.ap-south-1.amazonaws.com/devops-app:32
        imagePullPolicy: Always
        ports:
        - containerPort: 5000
---
apiVersion: v1
kind: Service
metadata:
  name: devops-app-service
  namespace: devops
spec:
  selector:
    app: devops-app
  ports:
  - port: 80
    targetPort: 5000
    protocol: TCP
  type: LoadBalancer
