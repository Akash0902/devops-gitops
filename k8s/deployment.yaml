apiVersion: apps/v1
kind: Deployment
metadata:
  name: devops-app
  namespace: devops
spec:
  replicas: 2
  selector:
    matchLabels:
      app: devops-app
  template:
    metadata:
      labels:
        app: devops-app
    spec:
      imagePullSecrets:
        - name: nexus-secret
      containers:
        - name: devops-app
          image: <IMAGE_TAG_HOLDER>
          imagePullPolicy: Always
          ports:
            - containerPort: 5000
